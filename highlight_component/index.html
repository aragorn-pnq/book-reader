<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    #root {
      height: 600px;
      overflow-y: auto;
      font-family: Georgia, serif;
      font-size: 16px;
      line-height: 1.8;
      color: #333;
      background: white;
    }

    #toolbar {
      position: sticky;
      top: 0;
      background: #fffbea;
      border-bottom: 2px solid #f0c800;
      padding: 10px 14px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    #toolbar.visible { display: flex; }

    #toolbar .preview {
      font-size: 13px;
      color: #666;
      font-style: italic;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #toolbar textarea {
      flex: 2;
      height: 34px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
      font-family: sans-serif;
      resize: none;
    }
    #toolbar .btns { display: flex; gap: 6px; flex-shrink: 0; }
    #toolbar button {
      padding: 6px 13px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    #save-btn   { background: #4a90d9; color: white; font-weight: 600; }
    #cancel-btn { background: #e0e0e0; color: #444; }

    #hint {
      font-size: 12px;
      color: #888;
      padding: 4px 16px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }

    #content { padding: 16px; }
    p { margin-bottom: 1.1rem; }

    .hl {
      background: #fff3b0;
      border-bottom: 2px solid #e6b800;
      cursor: help;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="toolbar">
      <span class="preview" id="sel-preview"></span>
      <textarea id="comment-input" placeholder="Add a comment (optional)..."></textarea>
      <div class="btns">
        <button id="save-btn">Save</button>
        <button id="cancel-btn">✕</button>
      </div>
    </div>
    <div id="hint">Select any text to highlight it</div>
    <div id="content"><em style="color:#bbb">Loading...</em></div>
  </div>

  <script>
    const ROOT = document.getElementById("root");
    let selectedText = "";
    let savedRange   = null;

    function toStreamlit(msg) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true }, msg),
        "*"
      );
    }

    // Set up message listener FIRST, then signal ready
    window.addEventListener("message", (event) => {
      const d = event.data;
      if (!d || !d.isStreamlitMessage) return;
      if (d.type === "streamlit:render") {
        const { chapter_text, highlights } = d.args || {};
        renderContent(chapter_text || "", highlights || []);
      }
    });

    toStreamlit({ type: "streamlit:componentReady", apiVersion: 1 });
    toStreamlit({ type: "streamlit:setFrameHeight", height: 624 });

    // ── Render ────────────────────────────────────────────────────────────
    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderContent(text, highlights) {
      const paras = text.split(/\n\n+/).filter(p => p.trim());
      let html = paras.map(p => `<p>${esc(p.trim())}</p>`).join("");

      [...highlights]
        .sort((a, b) => b.selected_text.length - a.selected_text.length)
        .forEach(h => {
          const e = esc(h.selected_text);
          const tip = h.comment ? ` title="${esc(h.comment)}"` : "";
          html = html.replace(e, `<span class="hl"${tip}>${e}</span>`);
        });

      document.getElementById("content").innerHTML = html;
    }

    // ── Selection ─────────────────────────────────────────────────────────
    document.addEventListener("selectionchange", () => {
      const sel = window.getSelection();
      const text = sel ? sel.toString().trim() : "";
      if (text.length >= 3) {
        selectedText = text;
        savedRange = sel.rangeCount > 0 ? sel.getRangeAt(0).cloneRange() : null;
      }
    });

    document.addEventListener("mouseup", (e) => {
      if (e.target.closest("#toolbar")) return;
      setTimeout(() => {
        const text = (window.getSelection() || {}).toString
          ? window.getSelection().toString().trim()
          : "";
        const finalText = text.length >= 3 ? text : selectedText;
        if (finalText.length >= 3) {
          if (text.length >= 3) {
            selectedText = text;
            const s = window.getSelection();
            if (s && s.rangeCount > 0) savedRange = s.getRangeAt(0).cloneRange();
          }
          showToolbar(finalText);
        }
      }, 20);
    });

    function showToolbar(text) {
      document.getElementById("sel-preview").textContent =
        `"${text.substring(0, 55)}${text.length > 55 ? "…" : ""}"`;
      document.getElementById("comment-input").value = "";
      document.getElementById("toolbar").classList.add("visible");
      ROOT.scrollTop = 0;
      setTimeout(() => document.getElementById("comment-input").focus(), 50);
    }

    function hideToolbar() {
      document.getElementById("toolbar").classList.remove("visible");
    }

    // ── Save / Cancel ─────────────────────────────────────────────────────
    document.getElementById("save-btn").addEventListener("click", () => {
      const comment = document.getElementById("comment-input").value.trim();
      if (savedRange) {
        try {
          const span = document.createElement("span");
          span.className = "hl";
          if (comment) span.title = comment;
          savedRange.surroundContents(span);
          window.getSelection().removeAllRanges();
        } catch (_) {}
      }
      hideToolbar();
      toStreamlit({
        type: "streamlit:componentValue",
        value: { selected_text: selectedText, comment: comment }
      });
      selectedText = "";
      savedRange = null;
    });

    document.getElementById("cancel-btn").addEventListener("click", () => {
      hideToolbar();
      window.getSelection().removeAllRanges();
      selectedText = "";
      savedRange = null;
    });
  </script>
</body>
</html>
