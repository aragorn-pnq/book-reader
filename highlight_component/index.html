<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    #root {
      height: 600px;
      overflow-y: auto;
      font-family: Georgia, serif;
      font-size: 16px;
      line-height: 1.8;
      color: #333;
      background: white;
    }

    #toolbar {
      position: sticky;
      top: 0;
      background: #fffbea;
      border-bottom: 2px solid #f0c800;
      padding: 10px 14px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    #toolbar.visible { display: flex; }

    #toolbar .preview {
      font-size: 13px;
      color: #666;
      font-style: italic;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #toolbar textarea {
      flex: 2;
      height: 34px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
      font-family: sans-serif;
      resize: none;
    }
    #toolbar .btns { display: flex; gap: 6px; flex-shrink: 0; }
    #toolbar button {
      padding: 6px 13px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    #save-btn   { background: #4a90d9; color: white; font-weight: 600; }
    #cancel-btn { background: #e0e0e0; color: #444; }

    #status {
      font-size: 11px;
      padding: 3px 16px;
      background: #f0f0f0;
      color: #888;
      border-bottom: 1px solid #e0e0e0;
    }

    #content { padding: 16px; }
    p { margin-bottom: 1.1rem; }

    .hl {
      background: #fff3b0;
      border-bottom: 2px solid #e6b800;
      cursor: help;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="toolbar">
      <span class="preview" id="sel-preview"></span>
      <textarea id="comment-input" placeholder="Add a comment (optional)..."></textarea>
      <div class="btns">
        <button id="save-btn">Save</button>
        <button id="cancel-btn">✕</button>
      </div>
    </div>
    <div id="status">Loading chapter text...</div>
    <div id="content"></div>
  </div>

  <script>
    const ROOT   = document.getElementById("root");
    const STATUS = document.getElementById("status");

    let selectedText = "";
    let savedRange   = null;
    let pendingShow  = false;  // flag: mouseup fired with valid selection

    // ── Streamlit handshake ───────────────────────────────────────────────
    window.addEventListener("message", (event) => {
      if (event.data.type === "streamlit:render") {
        const { chapter_text, highlights } = event.data.args;
        STATUS.textContent = "Select any text to highlight it";
        renderContent(chapter_text || "", highlights || []);
      }
    });

    // Signal ready AFTER listener is set up
    window.parent.postMessage({ type: "streamlit:componentReady", apiVersion: 1 }, "*");
    window.parent.postMessage({ type: "streamlit:setFrameHeight", height: 624 }, "*");

    // ── Render ────────────────────────────────────────────────────────────
    function esc(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderContent(text, highlights) {
      const paras = text.split(/\n\n+/).filter(p => p.trim());
      let html = paras.map(p => `<p>${esc(p.trim())}</p>`).join("");

      [...highlights]
        .sort((a, b) => b.selected_text.length - a.selected_text.length)
        .forEach(h => {
          const escaped = esc(h.selected_text);
          const tip = h.comment ? ` title="${esc(h.comment)}"` : "";
          html = html.replace(escaped, `<span class="hl"${tip}>${escaped}</span>`);
        });

      document.getElementById("content").innerHTML = html;
    }

    // ── Selection detection ───────────────────────────────────────────────
    // Use selectionchange to track what's selected at any moment
    document.addEventListener("selectionchange", () => {
      const sel = window.getSelection();
      const text = sel ? sel.toString().trim() : "";
      if (text.length >= 3) {
        selectedText = text;
        savedRange   = sel.rangeCount > 0 ? sel.getRangeAt(0).cloneRange() : null;
      }
    });

    // Use mouseup on document to trigger showing the toolbar
    document.addEventListener("mouseup", (e) => {
      if (e.target.closest("#toolbar")) return;

      // Give browser 20ms to finalise the selection, then show toolbar
      setTimeout(() => {
        const sel = window.getSelection();
        const text = sel ? sel.toString().trim() : "";

        // Also use whatever selectionchange captured
        const finalText = text.length >= 3 ? text : selectedText;

        if (finalText.length >= 3) {
          if (text.length >= 3) {
            selectedText = text;
            savedRange   = sel && sel.rangeCount > 0 ? sel.getRangeAt(0).cloneRange() : savedRange;
          }
          showToolbar(finalText);
        }
      }, 20);
    });

    function showToolbar(text) {
      document.getElementById("sel-preview").textContent =
        `"${text.substring(0, 55)}${text.length > 55 ? "…" : ""}"`;
      document.getElementById("comment-input").value = "";
      document.getElementById("toolbar").classList.add("visible");
      ROOT.scrollTop = 0;
      setTimeout(() => document.getElementById("comment-input").focus(), 50);
    }

    function hideToolbar() {
      document.getElementById("toolbar").classList.remove("visible");
    }

    // ── Save / Cancel ─────────────────────────────────────────────────────
    document.getElementById("save-btn").addEventListener("click", () => {
      const comment = document.getElementById("comment-input").value.trim();

      if (savedRange) {
        try {
          const span = document.createElement("span");
          span.className = "hl";
          if (comment) span.title = comment;
          savedRange.surroundContents(span);
          window.getSelection().removeAllRanges();
        } catch (_) { /* cross-element selection */ }
      }

      hideToolbar();
      window.parent.postMessage({
        type: "streamlit:componentValue",
        value: { selected_text: selectedText, comment: comment }
      }, "*");

      selectedText = "";
      savedRange   = null;
    });

    document.getElementById("cancel-btn").addEventListener("click", () => {
      hideToolbar();
      window.getSelection().removeAllRanges();
      selectedText = "";
      savedRange   = null;
    });
  </script>
</body>
</html>
