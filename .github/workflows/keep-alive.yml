name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 9 * * *"   # every day at 09:00 UTC (was every 3 days - too little activity for Supabase's 7-day pause rule)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read ping (books table)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/books?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")
          echo "Supabase books read responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: unexpected status $STATUS"
            exit 1
          fi
      - name: Write ping (keep_alive table)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}')
          echo "Supabase keep_alive insert responded with HTTP $STATUS"
          if [ "$STATUS" != "201" ]; then
            echo "WARNING: unexpected status $STATUS"
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep repository active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled Supabase ping active"
          git push origin HEAD:main
