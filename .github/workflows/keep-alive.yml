name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 9 */3 * *"   # days 1,4,7,... at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase DB
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/books?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: unexpected status $STATUS"
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep repository active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled Supabase ping active"
          git push origin HEAD:main
